<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulir</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    
        <nav class="navbar">
        <h1 class="logo">Universitas Negeri Islam</h1>
        <p class="subtitle">Technical and Music Industry</p>
    </nav>

    <form class="isi">
        <h2>Formulir Pendaftaran Mahasiswa</h2>

        <label>Nama Lengkap</label>
        <input type="text" placeholder="Masukkan nama">

        <label>Email</label>
        <input type="email" placeholder="email@gmail.com">

        <label>Password</label>
        <input type="password" placeholder="Password">

        <label>Umur</label>
        <input type="number" min="17" max="60">

        <label>Tanggal Lahir</label>
        <input type="date">

        <label>Jam Belajar Favorit</label>
        <input type="time">

        <label>Nomor Telepon</label>
        <input type="tel" placeholder="08xxxxxxxxxx">

        <label>Website Pribadi</label>
        <input type="url" placeholder="https://">

        <label>Warna Favorit</label>
        <input type="color">

        <label>Upload Foto</label>
        <input type="file">

        <label>Tingkat Ketertarikan pada Programming</label>
        <input type="range" min="0" max="100">

        <label>Jenis Kelamin</label>
        <div class="pilihan">
            <input type="radio" name="gender"> Laki-laki
            <input type="radio" name="gender"> Perempuan
        </div>

        <label>Bahasa yang Dikuasai</label>
        <div class="pilihan">
            <input type="checkbox"> HTML
            <input type="checkbox"> CSS
            <input type="checkbox"> JavaScript
            <input type="checkbox"> Python
        </div>

        <label>Jurusan</label>
        <select>
            <option>Teknik Informatika</option>
            <option>Sistem Informasi</option>
            <option>Desain Grafis</option>
            <option>Musik Digital</option>
        </select>

        <label>Alasan Masuk Universitas Ini</label>
        <textarea rows="5"></textarea>
        <button type="submit" class="submite2"onclick="berhasilSimpan()">Kirim</button>
        <button type="reset">Reset</button>
    </form>
<script src="main2.js"></script>
</body>
</html>
